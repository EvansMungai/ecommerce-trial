name: CI pipeline

on: 
  push:
    branches:
      - main

jobs:
  Catalog-Image:
    name: Build Catalog Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build and Push Catalog Docker Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with: 
        context: .
        file: ./Catalog.API/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/catalog:latest

  Order-Image:
    name: Build Order Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_PASSWORD }}

    - name: Build and Push Catalog Docker Image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
      with: 
        context: .
        file: ./Order.API/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/order:latest